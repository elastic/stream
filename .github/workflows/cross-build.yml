name: cross-build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Verify that stream builds for every platform we expect users to install it
  # on, without cgo and without any C toolchain or libpcap present. This is what
  # `go install github.com/elastic/stream@latest` does on a user's machine.
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: build
        run: go build -o /dev/null .

      - name: vet
        run: go vet ./...

  # Run the tests on real runners so platform specific behavior, such as signal
  # name lookup, is exercised and not just compiled.
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: test
        run: go test ./internal/command/...
